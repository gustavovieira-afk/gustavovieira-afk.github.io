<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <!-- Ilustração: planilha se preenchendo sozinha, com cartão de gráficos -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2420" />
      <stop offset="1" stop-color="#0a1214" />
    </linearGradient>
    <radialGradient id="brilho">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".32" />
      <stop offset="1" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
    <clipPath id="janela"><rect x="22" y="22" width="300" height="180" rx="10" /></clipPath>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".5" />
    </filter>
  </defs>
  <style>
    .linha { transform-box: fill-box; transform-origin: left center; animation: preencher 8s ease-out infinite both; }
    @keyframes preencher {
      0% { transform: scaleX(0); opacity: 1; }
      6% { transform: scaleX(1); }
      86% { transform: scaleX(1); opacity: 1; }
      94%, 100% { transform: scaleX(1); opacity: 0; }
    }
    .barra { transform-box: fill-box; transform-origin: 50% 100%; animation: sobe 4s ease-in-out infinite; }
    @keyframes sobe { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
    .cartao { animation: flutua 5s ease-in-out infinite; }
    @keyframes flutua { 50% { transform: translateY(-7px); } }
    .rosca { transform-origin: 300px 165px; animation: gira 12s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="400" height="225" fill="url(#fundo)" />
  <circle cx="190" cy="112" r="170" fill="url(#brilho)" />

  <!-- janela da planilha -->
  <g clip-path="url(#janela)">
    <rect x="22" y="22" width="300" height="180" fill="#f8fafc" />
    <rect x="22" y="22" width="300" height="20" fill="#16a34a" />
    <circle cx="34" cy="32" r="3" fill="#fff" fill-opacity=".9" />
    <circle cx="44" cy="32" r="3" fill="#fff" fill-opacity=".7" />
    <circle cx="54" cy="32" r="3" fill="#fff" fill-opacity=".5" />
    <rect x="22" y="42" width="300" height="14" fill="#eef2f4" />
    <rect x="28" y="46" width="14" height="6" rx="2" fill="#16a34a" fill-opacity=".7" />
    <rect x="48" y="46" width="120" height="6" rx="3" fill="#cbd5e1" />

    <!-- cabeçalho das colunas -->
    <rect x="22" y="56" width="300" height="13" fill="#e2e8f0" />
    <rect x="22" y="56" width="16" height="146" fill="#e2e8f0" />
    <g fill="#94a3b8">
      <rect x="62" y="60" width="8" height="5" rx="1" /><rect x="118" y="60" width="8" height="5" rx="1" />
      <rect x="174" y="60" width="8" height="5" rx="1" /><rect x="230" y="60" width="8" height="5" rx="1" />
      <rect x="286" y="60" width="8" height="5" rx="1" />
    </g>

    <!-- linhas de grade -->
    <g stroke="#dbe3e8" stroke-width="1">
      <line x1="38" y1="85" x2="322" y2="85" /><line x1="38" y1="101" x2="322" y2="101" />
      <line x1="38" y1="117" x2="322" y2="117" /><line x1="38" y1="133" x2="322" y2="133" />
      <line x1="38" y1="149" x2="322" y2="149" /><line x1="38" y1="165" x2="322" y2="165" />
      <line x1="38" y1="181" x2="322" y2="181" />
      <line x1="94" y1="56" x2="94" y2="202" /><line x1="150" y1="56" x2="150" y2="202" />
      <line x1="206" y1="56" x2="206" y2="202" /><line x1="262" y1="56" x2="262" y2="202" />
    </g>

    <!-- linhas se preenchendo, uma de cada vez -->
    <g class="linha" style="animation-delay:.2s">
      <rect x="44" y="74" width="40" height="5" rx="2" fill="#334155" /><rect x="100" y="74" width="36" height="5" rx="2" fill="#334155" />
      <rect x="156" y="74" width="40" height="5" rx="2" fill="#334155" /><rect x="212" y="74" width="34" height="5" rx="2" fill="#334155" />
      <rect x="268" y="74" width="38" height="5" rx="2" fill="#16a34a" />
    </g>
    <g class="linha" style="animation-delay:.6s">
      <rect x="44" y="90" width="34" height="5" rx="2" fill="#94a3b8" /><rect x="100" y="90" width="28" height="5" rx="2" fill="#94a3b8" />
      <rect x="156" y="90" width="38" height="5" rx="2" fill="#94a3b8" /><rect x="212" y="90" width="24" height="5" rx="2" fill="#94a3b8" />
      <rect x="264" y="87" width="54" height="11" rx="2" fill="#22c55e" fill-opacity=".18" /><rect x="268" y="90" width="32" height="5" rx="2" fill="#16a34a" />
    </g>
    <g class="linha" style="animation-delay:1s">
      <rect x="44" y="106" width="42" height="5" rx="2" fill="#94a3b8" /><rect x="100" y="106" width="32" height="5" rx="2" fill="#94a3b8" />
      <rect x="156" y="106" width="30" height="5" rx="2" fill="#94a3b8" /><rect x="212" y="106" width="36" height="5" rx="2" fill="#94a3b8" />
      <rect x="264" y="103" width="54" height="11" rx="2" fill="#22c55e" fill-opacity=".18" /><rect x="268" y="106" width="36" height="5" rx="2" fill="#16a34a" />
    </g>
    <g class="linha" style="animation-delay:1.4s">
      <rect x="44" y="122" width="30" height="5" rx="2" fill="#94a3b8" /><rect x="100" y="122" width="38" height="5" rx="2" fill="#94a3b8" />
      <rect x="156" y="122" width="34" height="5" rx="2" fill="#94a3b8" /><rect x="212" y="122" width="28" height="5" rx="2" fill="#94a3b8" />
      <rect x="264" y="119" width="54" height="11" rx="2" fill="#22c55e" fill-opacity=".18" /><rect x="268" y="122" width="30" height="5" rx="2" fill="#16a34a" />
    </g>
    <g class="linha" style="animation-delay:1.8s">
      <rect x="44" y="138" width="38" height="5" rx="2" fill="#94a3b8" /><rect x="100" y="138" width="26" height="5" rx="2" fill="#94a3b8" />
      <rect x="156" y="138" width="42" height="5" rx="2" fill="#94a3b8" /><rect x="212" y="138" width="32" height="5" rx="2" fill="#94a3b8" />
      <rect x="264" y="135" width="54" height="11" rx="2" fill="#22c55e" fill-opacity=".18" /><rect x="268" y="138" width="38" height="5" rx="2" fill="#16a34a" />
    </g>
    <g class="linha" style="animation-delay:2.2s">
      <rect x="44" y="154" width="36" height="5" rx="2" fill="#94a3b8" /><rect x="100" y="154" width="34" height="5" rx="2" fill="#94a3b8" />
      <rect x="156" y="154" width="28" height="5" rx="2" fill="#94a3b8" /><rect x="212" y="154" width="40" height="5" rx="2" fill="#94a3b8" />
      <rect x="264" y="151" width="54" height="11" rx="2" fill="#22c55e" fill-opacity=".18" /><rect x="268" y="154" width="34" height="5" rx="2" fill="#16a34a" />
    </g>
    <g class="linha" style="animation-delay:2.8s">
      <rect x="44" y="170" width="30" height="5" rx="2" fill="#334155" />
      <rect x="264" y="167" width="54" height="11" rx="2" fill="#16a34a" /><rect x="268" y="170" width="40" height="5" rx="2" fill="#fff" />
    </g>
  </g>
  <rect x="22" y="22" width="300" height="180" rx="10" fill="none" stroke="#1f3b33" />

  <!-- cartão flutuante com gráficos -->
  <g class="cartao">
    <g filter="url(#sombra)">
      <rect x="266" y="128" width="122" height="78" rx="10" fill="#ffffff" />
    </g>
    <g class="rosca">
      <circle cx="300" cy="165" r="18" fill="none" stroke="#e2e8f0" stroke-width="8" />
      <circle cx="300" cy="165" r="18" fill="none" stroke="#16a34a" stroke-width="8" stroke-dasharray="52 113" />
      <circle cx="300" cy="165" r="18" fill="none" stroke="#22d3ee" stroke-width="8" stroke-dasharray="32 113" stroke-dashoffset="-52" />
      <circle cx="300" cy="165" r="18" fill="none" stroke="#7c5cff" stroke-width="8" stroke-dasharray="20 113" stroke-dashoffset="-84" />
    </g>
    <line x1="330" y1="190" x2="378" y2="190" stroke="#e2e8f0" />
    <rect class="barra" style="animation-delay:-.3s" x="334" y="166" width="8" height="24" rx="2" fill="#16a34a" />
    <rect class="barra" style="animation-delay:-1.3s" x="347" y="154" width="8" height="36" rx="2" fill="#22c55e" />
    <rect class="barra" style="animation-delay:-2.3s" x="360" y="146" width="8" height="44" rx="2" fill="#16a34a" />
    <rect x="334" y="138" width="34" height="5" rx="2.5" fill="#14112b" />
  </g>
</svg>
