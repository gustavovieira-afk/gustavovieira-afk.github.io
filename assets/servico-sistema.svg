<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <!-- Ilustração: painel de um sistema com gráfico animado -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1538" />
      <stop offset="1" stop-color="#0d0a1c" />
    </linearGradient>
    <radialGradient id="brilho">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45" />
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="barra" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <clipPath id="janela"><rect x="40" y="22" width="300" height="180" rx="10" /></clipPath>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45" />
    </filter>
  </defs>
  <style>
    .barra { transform-box: fill-box; transform-origin: 50% 100%; animation: sobe 4s ease-in-out infinite; }
    @keyframes sobe { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
    .aviso { animation: flutua 4s ease-in-out infinite; }
    @keyframes flutua { 50% { transform: translateY(-6px); } }
    .ativo { animation: pisca 2s ease-in-out infinite; }
    @keyframes pisca { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="400" height="225" fill="url(#fundo)" />
  <circle cx="200" cy="112" r="170" fill="url(#brilho)" />

  <!-- janela do sistema -->
  <g clip-path="url(#janela)">
    <rect x="40" y="22" width="300" height="180" fill="#1f1b3a" />
    <rect x="40" y="22" width="300" height="18" fill="#28224a" />
    <circle cx="52" cy="31" r="3" fill="#f87171" />
    <circle cx="62" cy="31" r="3" fill="#fbbf24" />
    <circle cx="72" cy="31" r="3" fill="#34d399" />

    <!-- menu lateral -->
    <rect x="40" y="40" width="62" height="162" fill="#18142e" />
    <circle cx="56" cy="54" r="6" fill="#7c5cff" />
    <rect x="66" y="51" width="28" height="6" rx="3" fill="#3a3460" />
    <rect x="46" y="70" width="50" height="14" rx="4" fill="#7c5cff" fill-opacity=".25" />
    <rect x="52" y="74" width="34" height="6" rx="3" fill="#a78bfa" />
    <rect x="52" y="94" width="38" height="6" rx="3" fill="#3a3460" />
    <rect x="52" y="110" width="30" height="6" rx="3" fill="#3a3460" />
    <rect x="52" y="126" width="36" height="6" rx="3" fill="#3a3460" />
    <rect x="52" y="142" width="26" height="6" rx="3" fill="#3a3460" />

    <!-- cartões de números -->
    <rect x="112" y="50" width="68" height="40" rx="6" fill="#28224a" />
    <rect x="120" y="59" width="30" height="4" rx="2" fill="#5b5580" />
    <rect x="120" y="69" width="42" height="9" rx="2" fill="#a78bfa" class="ativo" />
    <rect x="188" y="50" width="68" height="40" rx="6" fill="#28224a" />
    <rect x="196" y="59" width="26" height="4" rx="2" fill="#5b5580" />
    <rect x="196" y="69" width="36" height="9" rx="2" fill="#22d3ee" />
    <rect x="264" y="50" width="68" height="40" rx="6" fill="#28224a" />
    <rect x="272" y="59" width="32" height="4" rx="2" fill="#5b5580" />
    <rect x="272" y="69" width="44" height="9" rx="2" fill="#34d399" />

    <!-- gráfico -->
    <rect x="112" y="98" width="220" height="96" rx="6" fill="#28224a" />
    <rect x="122" y="107" width="50" height="5" rx="2" fill="#5b5580" />
    <line x1="122" y1="184" x2="322" y2="184" stroke="#3a3460" />
    <rect class="barra" style="animation-delay:-0.2s" x="128" y="140" width="13" height="44" rx="3" fill="url(#barra)" />
    <rect class="barra" style="animation-delay:-0.8s" x="150" y="128" width="13" height="56" rx="3" fill="url(#barra)" />
    <rect class="barra" style="animation-delay:-1.4s" x="172" y="146" width="13" height="38" rx="3" fill="url(#barra)" />
    <rect class="barra" style="animation-delay:-2.0s" x="194" y="122" width="13" height="62" rx="3" fill="url(#barra)" />
    <rect class="barra" style="animation-delay:-2.6s" x="216" y="134" width="13" height="50" rx="3" fill="url(#barra)" />
    <rect class="barra" style="animation-delay:-3.2s" x="238" y="120" width="13" height="64" rx="3" fill="url(#barra)" />
    <rect class="barra" style="animation-delay:-0.5s" x="260" y="138" width="13" height="46" rx="3" fill="url(#barra)" />
    <rect class="barra" style="animation-delay:-1.1s" x="282" y="126" width="13" height="58" rx="3" fill="url(#barra)" />
    <rect class="barra" style="animation-delay:-1.7s" x="304" y="116" width="13" height="68" rx="3" fill="url(#barra)" />
  </g>
  <rect x="40" y="22" width="300" height="180" rx="10" fill="none" stroke="#3a3460" />

  <!-- aviso flutuante: venda registrada -->
  <g class="aviso">
    <g filter="url(#sombra)">
      <rect x="276" y="158" width="104" height="38" rx="9" fill="#ffffff" />
    </g>
    <circle cx="295" cy="177" r="10" fill="#34d399" />
    <path d="M290 177 l3.5 3.5 l6.5 -7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="311" y="168" width="56" height="6" rx="3" fill="#14112b" />
    <rect x="311" y="180" width="38" height="5" rx="2.5" fill="#9a9ab3" />
  </g>
</svg>
