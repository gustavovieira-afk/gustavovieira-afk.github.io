<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <!-- Ilustração: site sendo montado no navegador e no celular -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1d33" />
      <stop offset="1" stop-color="#0a0d1c" />
    </linearGradient>
    <radialGradient id="brilho">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="destaque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
    <clipPath id="janela"><rect x="26" y="22" width="262" height="180" rx="10" /></clipPath>
    <filter id="sombra" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".5" />
    </filter>
  </defs>
  <style>
    .surge { animation: surgir 7s ease-out infinite both; }
    @keyframes surgir {
      0% { opacity: 0; transform: translateY(8px); }
      8% { opacity: 1; transform: none; }
      86% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    .celular { animation: flutua 5s ease-in-out infinite; }
    @keyframes flutua { 50% { transform: translateY(-7px); } }
    .cursor { animation: mover 7s ease-in-out infinite; }
    @keyframes mover {
      0%, 30% { transform: translate(80px, 60px); }
      50%, 62% { transform: translate(0, 0); }
      85%, 100% { transform: translate(80px, 60px); }
    }
    .clique { transform-box: fill-box; transform-origin: center; animation: clicar 7s ease-in-out infinite; }
    @keyframes clicar { 0%, 52% { transform: scale(1); } 56% { transform: scale(.88); } 60%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .cursor { transform: translate(0, 0); }
    }
  </style>

  <rect width="400" height="225" fill="url(#fundo)" />
  <circle cx="220" cy="112" r="170" fill="url(#brilho)" />

  <!-- navegador -->
  <g clip-path="url(#janela)">
    <rect x="26" y="22" width="262" height="180" fill="#1b2238" />
    <rect x="26" y="22" width="262" height="22" fill="#232c47" />
    <circle cx="38" cy="33" r="3" fill="#f87171" />
    <circle cx="48" cy="33" r="3" fill="#fbbf24" />
    <circle cx="58" cy="33" r="3" fill="#34d399" />
    <rect x="76" y="27" width="160" height="12" rx="6" fill="#111729" />
    <circle cx="86" cy="33" r="2.5" fill="#34d399" />
    <rect x="94" y="31" width="70" height="4" rx="2" fill="#4b5878" />

    <!-- conteúdo do site (aparece por partes) -->
    <g class="surge" style="animation-delay:.2s">
      <rect x="38" y="54" width="238" height="58" rx="7" fill="url(#destaque)" />
      <circle cx="244" cy="83" r="17" fill="#fff" fill-opacity=".22" />
      <circle cx="244" cy="83" r="9" fill="#fff" fill-opacity=".35" />
    </g>
    <rect class="surge" style="animation-delay:.6s" x="50" y="66" width="112" height="10" rx="3" fill="#fff" />
    <rect class="surge" style="animation-delay:.9s" x="50" y="82" width="82" height="5" rx="2.5" fill="#fff" fill-opacity=".75" />
    <rect class="surge clique" style="animation-delay:1.2s" x="50" y="94" width="46" height="12" rx="6" fill="#fff" />

    <g class="surge" style="animation-delay:1.6s">
      <rect x="38" y="122" width="74" height="70" rx="6" fill="#232c47" />
      <rect x="44" y="128" width="62" height="30" rx="4" fill="#22d3ee" fill-opacity=".3" />
      <rect x="44" y="164" width="46" height="5" rx="2.5" fill="#6b7a9c" />
      <rect x="44" y="174" width="34" height="4" rx="2" fill="#4b5878" />
    </g>
    <g class="surge" style="animation-delay:1.9s">
      <rect x="120" y="122" width="74" height="70" rx="6" fill="#232c47" />
      <rect x="126" y="128" width="62" height="30" rx="4" fill="#7c5cff" fill-opacity=".35" />
      <rect x="126" y="164" width="40" height="5" rx="2.5" fill="#6b7a9c" />
      <rect x="126" y="174" width="30" height="4" rx="2" fill="#4b5878" />
    </g>
    <g class="surge" style="animation-delay:2.2s">
      <rect x="202" y="122" width="74" height="70" rx="6" fill="#232c47" />
      <rect x="208" y="128" width="62" height="30" rx="4" fill="#ec4899" fill-opacity=".3" />
      <rect x="208" y="164" width="44" height="5" rx="2.5" fill="#6b7a9c" />
      <rect x="208" y="174" width="28" height="4" rx="2" fill="#4b5878" />
    </g>
  </g>
  <rect x="26" y="22" width="262" height="180" rx="10" fill="none" stroke="#2c3654" />

  <!-- cursor do mouse indo até o botão -->
  <g transform="translate(78 100)">
    <g class="cursor">
      <path d="M0 0 L0 15 L4 11 L7.5 18 L10 17 L6.5 10 L12 10 Z" fill="#fff" stroke="#0a0d1c" stroke-width="1.2" stroke-linejoin="round" />
    </g>
  </g>

  <!-- celular com a versão mobile -->
  <g class="celular">
    <g filter="url(#sombra)">
      <rect x="300" y="56" width="80" height="150" rx="13" fill="#1b2238" stroke="#2c3654" />
    </g>
    <rect x="306" y="68" width="68" height="130" rx="7" fill="#111729" />
    <rect x="329" y="61" width="22" height="3" rx="1.5" fill="#2c3654" />
    <rect x="311" y="74" width="58" height="38" rx="5" fill="url(#destaque)" />
    <rect x="316" y="82" width="36" height="6" rx="2" fill="#fff" />
    <rect x="316" y="93" width="26" height="4" rx="2" fill="#fff" fill-opacity=".75" />
    <rect x="316" y="101" width="22" height="7" rx="3.5" fill="#fff" />
    <rect x="311" y="118" width="58" height="34" rx="5" fill="#232c47" />
    <rect x="315" y="122" width="50" height="16" rx="3" fill="#22d3ee" fill-opacity=".3" />
    <rect x="315" y="142" width="34" height="4" rx="2" fill="#6b7a9c" />
    <rect x="311" y="158" width="58" height="34" rx="5" fill="#232c47" />
    <rect x="315" y="162" width="50" height="16" rx="3" fill="#7c5cff" fill-opacity=".35" />
    <rect x="315" y="182" width="30" height="4" rx="2" fill="#6b7a9c" />
  </g>
</svg>
